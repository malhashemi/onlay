<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fidelity c — class variant</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f2ff; padding: 40px; }
  .panel { width: 420px; padding: 28px; background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(30,20,80,0.12); }
  .panel h2 { font-size: 22px; color: #201a3a; margin-bottom: 14px; }
  .btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 8px;
    border: 0;
    font-size: 15px;
    font-weight: 600;
    color: #201a3a;
    background: #e6e2f5; /* base */
    cursor: pointer;
  }
  /* the light-DOM design-system utility class the setClass variant toggles
     (render spec §4.2 fixture c: `.btn--brand{background:orange}` — background
     only; a text-color change is covered by the known-defect test in the gate) */
  .btn--brand { background: #ff7a18; }
</style>
</head>
<body>
  <section class="panel" id="panel">
    <h2>Confirm your plan</h2>
    <button class="btn" id="cta" type="button">Upgrade now</button>
  </section>
</body>
</html>
