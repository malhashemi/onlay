<!doctype html>
<!-- A same-origin frame inside the captured block: onlay mounts its own
     overlay host here too, which a look of the parent must hide. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Child frame</title>
  <style>
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #e8f0ff; }
    p { margin: 8px; }
  </style>
</head>
<body>
  <p>Inside a same-origin frame.</p>
</body>
</html>
