<!doctype html>
<!-- The page the smoke journeys work on: a few plain blocks, no scripts. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pricing</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 48px; color: #1f2933; }
    main { max-width: 640px; }
    h1 { font-size: 32px; margin: 0 0 16px; }
    .plan { border: 1px solid #d0d7de; border-radius: 8px; padding: 16px 20px; margin: 16px 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="headline">Simple pricing for small teams</h1>
    <p id="lede">One plan, every feature, no seat limits.</p>
    <section class="plan" id="plan-team">
      <h2>Team</h2>
      <p id="price">Twelve dollars a month, billed yearly.</p>
    </section>
    <section class="plan" id="plan-studio">
      <h2>Studio</h2>
      <p id="studio-price">Forty dollars a month, billed yearly.</p>
    </section>
  </main>
</body>
</html>
