<!doctype html>
<!-- The real page inside dossier-shell.html's frame, served from another
     origin than the shell. `?foreign=<origin>` lays a frame from that origin
     over the #covered block (another site's frame, not on the path).
     `?clear=1` takes every background away: the page is a transparent frame.
     `?live=1` rewrites #tall-text whenever the page scrolls.
     A blank child frame (`about:blank`, written by this page) holds #blank-text;
     `?tiltblank=1` rotates that frame.
     #tall is taller than the frame's view, two colours split at 800px; #far
     lies well below the fold; #pane-text is deep inside a scrolling pane. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Content page</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fbfaf7; }
    main { max-width: 640px; margin: 40px auto; padding: 0 24px; }
    section { margin: 0 0 32px; padding: 24px; background: #fff6e0; border-radius: 8px; }
    #covered { position: relative; height: 140px; background: #e8f0ff; }
    #foreign { position: absolute; left: 40px; top: 40px; width: 200px; height: 60px; border: 0; }
    #blank { display: block; width: 400px; height: 60px; border: 0; margin: 0 auto 40px; }
    #tall {
      height: 1600px; box-sizing: border-box; border-radius: 0;
      background: linear-gradient(#dcefdc 0 800px, #efdcef 800px 1600px);
    }
    #far { margin-top: 1400px; }
    #pane { height: 160px; overflow: auto; background: #fff6e0; }
    #pane-text { margin: 600px 0 400px; }
    .clear, .clear body, .clear section { background: transparent !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">CEO office</h1>
    <section id="goal">
      <h2>Goal</h2>
      <p id="goal-text">Close the quarter with a plan everyone has read.</p>
    </section>
    <section id="notes" data-onlay-source="src/pages/goals/ceo.astro:14:5">
      <p id="notes-text">Weekly notes from the office.</p>
    </section>
    <section id="covered">
      <p id="covered-text">A block under another site's frame.</p>
    </section>
    <section id="pane-wrap">
      <div id="pane"><p id="pane-text">A block inside a scrolling pane.</p></div>
    </section>
    <section id="tall">
      <p id="tall-text">A block taller than the frame shows at once.</p>
    </section>
    <section id="far">
      <p id="far-text">A block far down the page.</p>
    </section>
  </main>
  <iframe id="blank" title="Blank frame"></iframe>
  <script>
    const blank = document.getElementById("blank").contentDocument;
    blank.body.innerHTML = '<p id="blank-text" style="margin:8px">In a blank frame.</p>';
    if (new URLSearchParams(location.search).get("tiltblank"))
      document.getElementById("blank").style.transform = "rotate(4deg)";
    if (new URLSearchParams(location.search).get("clear"))
      document.documentElement.classList.add("clear");
    // `?live=1`: #tall-text says where the page is scrolled, as a live table would update.
    if (new URLSearchParams(location.search).get("live"))
      addEventListener("scroll", () => {
        document.getElementById("tall-text").textContent = `Rows as of scroll ${Math.round(scrollY)}.`;
      });
    const foreign = new URLSearchParams(location.search).get("foreign");
    if (foreign) {
      const f = document.createElement("iframe");
      f.id = "foreign";
      f.title = "Another site";
      f.src = new URL("/frame-child.html", foreign).href;
      document.getElementById("covered").appendChild(f);
    }
  </script>
</body>
</html>
