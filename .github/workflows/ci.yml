name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its stale run. Runs on main queue
# instead, so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.3.14"
  # The deploy job installs this exact archive itself and checks it against
  # the SHA-256 in Bun's SHASUMS256.txt for the release.
  BUN_LINUX_X64_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The tracked tree, as the public repository holds it, under gitleaks'
      # default rules; .gitleaks.toml allows only the manifest's public key and
      # RFC 8291's test vector, each in its own files. The binary is pinned by
      # its release checksum.
      - name: Secret scan (gitleaks)
        run: |
          curl --silent --show-error --fail --location --max-time 60 --output "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tree" --config .gitleaks.toml --redact --no-banner
      - run: bun install --frozen-lockfile
      # fallow is a pinned dev dependency (package.json), like biome and tsc.
      - name: biome, tsc, fallow, notices, unit tests
        run: bun run check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Workers-runtime suite (edge, directory, MCP, space Durable Object)
        run: bun run test:workers

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        working-directory: e2e
        run: bunx playwright install-deps chromium
      - name: Smoke set (builds both clients, wrangler dev, unpacked extension)
        run: bun run test:e2e
      - name: Keep traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    # Only this repository deploys: a fork, or a renamed copy, that pushes to
    # its own main builds and keeps the packages and never deploys, even if it
    # holds Cloudflare credentials.
    if: github.repository == 'malhashemi/onlay' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, server, e2e]
    # The Cloudflare token and account id are secrets of the `production`
    # environment, whose deployment branches are limited to main; no
    # repository-level secret holds them, so no other branch's run can read them.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The extension and the stamp tarball carry 0.2.<run number>; /healthz
    # reports it, and an unpacked install older than it says so in its popup.
    # The 0.2 series began with this repository, whose run numbers start again
    # at 1: every 0.2.x is newer than any 0.1.x already shipped.
    # The official origins, pinned here so the packages never rest on a default.
    env:
      RELEASE_VERSION: 0.2.${{ github.run_number }}
      ONLAY_EXTENSION_VERSION: 0.2.${{ github.run_number }}
      ONLAY_STAMP_VERSION: 0.2.${{ github.run_number }}
      ONLAY_SERVER_ORIGIN: https://app.onlay.dev
      ONLAY_SITE_ORIGIN: https://onlay.dev
      ONLAY_SERVICE_ORIGIN: https://app.onlay.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Secrets can't gate a job; this step turns "is the token set" (in the
      # production environment) into an output every Cloudflare step checks, so
      # an environment without the token builds and keeps the packages but
      # skips the deploy cleanly.
      - name: Check for the Cloudflare token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."; fi
      # Everything up to the upload builds what this commit ships, with or
      # without the token: the store package is kept as an artifact either way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun, in the job that holds production credentials, from its release
      # archive checked against the pinned SHA-256 before anything runs it.
      - name: Install Bun (checked by digest)
        run: |
          curl --silent --show-error --fail --location --max-time 120 --output "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_LINUX_X64_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum --check --quiet
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          ln -s bun "$RUNNER_TEMP/bun-linux-x64/bunx"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bun-linux-x64/bun" --version | grep -qx "$BUN_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The web app, then the landing page (packages/site) staged beside it in
      # the assets directory's landing/ folder (packages/server/scripts/stage-site.ts),
      # its links on the production service (ONLAY_SERVICE_ORIGIN, above).
      - name: Build the web app and the landing page
        run: bun run build:web
      # NODE_ENV=production (set by the scripts): the service and the site
      # pinned above, no local dev servers (a release build refuses http: and
      # loopback origins). The unpacked zip keeps the manifest key, so its id is
      # the one EXTENSION_IDS names; the store package has no key.
      - name: Build the extension (unpacked zip and store package)
        run: |
          bun run build:ext:release
          bun run build:ext:store
      # Both finished manifests, exactly: the service alone as host, the service
      # and the site as the only pages that may message the extension.
      - name: Check both extension packages name only the official origins
        run: |
          failed=0
          for zip in onlay-extension.zip onlay-extension-store.zip; do
            manifest=$(unzip -p "packages/extension/release/$zip" manifest.json)
            hosts=$(printf '%s' "$manifest" | jq -c '.host_permissions')
            pages=$(printf '%s' "$manifest" | jq -c '.externally_connectable.matches | sort')
            if [ "$hosts" = '["https://app.onlay.dev/*"]' ] && [ "$pages" = '["https://app.onlay.dev/*","https://onlay.dev/*"]' ]; then
              echo "$zip: $hosts, $pages"
            else
              echo "::error::$zip names $hosts as hosts and $pages as pages"; failed=1
            fi
          done
          exit "$failed"
      - name: Build the stamp tarball
        run: bun run build:stamp:tarball
      # The Worker serves exactly these two names from the assets' download/
      # folder (/download/<name>); nothing else is written there.
      - name: Put the downloads beside the web app
        run: |
          mkdir -p packages/pwa/dist/download
          cp packages/extension/release/onlay-extension.zip packages/pwa/dist/download/
          cp packages/stamp/release/onlay-stamp.tgz packages/pwa/dist/download/
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ env.RELEASE_VERSION }}-attempt-${{ github.run_attempt }}
          path: |
            packages/extension/release/onlay-extension.zip
            packages/extension/release/onlay-extension-store.zip
            packages/stamp/release/onlay-stamp.tgz
          retention-days: 90
          if-no-files-found: error
      - name: Apply D1 migrations to production
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packages/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply onlay-production --remote
      # The top level of wrangler.jsonc is production; there is no env.production.
      - name: Deploy the Worker
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packages/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        # The staged landing page must be exactly this run's fresh build.
        run: |
          bun run scripts/stage-site.ts --check
          bunx wrangler deploy --var "SHA:$SHA" --var "EXTENSION_VERSION:$RELEASE_VERSION"
      # One Worker, two hosts (packages/server/src/edge/hosts.ts): the service
      # at app.onlay.dev, the public site at onlay.dev. Each check goes to the
      # host that serves the thing it checks.
      - name: Check /healthz on both hosts reports this commit
        if: steps.gate.outputs.enabled == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for host in https://app.onlay.dev https://onlay.dev; do
            ok=0
            for attempt in $(seq 1 60); do
              served=$(curl --silent --show-error --fail --max-time 10 "$host/healthz" | jq -r '"\(.sha) \(.extension)"' || true)
              if [ "$served" = "$SHA $RELEASE_VERSION" ]; then echo "$host/healthz reports $SHA, extension $RELEASE_VERSION"; ok=1; break; fi
              echo "attempt $attempt: $host/healthz reports '${served}', waiting for $SHA $RELEASE_VERSION"
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "::error::$host/healthz never reported $SHA with extension $RELEASE_VERSION"
              exit 1
            fi
          done
      - name: Check the site serves the downloads and the install page
        if: steps.gate.outputs.enabled == 'true'
        run: |
          failed=0
          check() {
            got=$(curl --silent --show-error --head --max-time 15 --output /dev/null --write-out '%{http_code} %{content_type}' "https://onlay.dev$1" || true)
            case "$got" in
              "200 $2"*) echo "$1: $got" ;;
              *) echo "::error::https://onlay.dev$1 answered '$got', not 200 $2"; failed=1 ;;
            esac
          }
          check /download/onlay-extension.zip application/zip
          check /download/onlay-stamp.tgz application/gzip
          check /install text/html
          exit "$failed"
      # The landing page at https://onlay.dev/, against what this run built
      # (packages/server/scripts/check-landing.ts): the document byte for byte
      # (sha256) under its exact policy, linking to the production web app and
      # never clearing a visitor's storage (the old /app/sw.js still does); the
      # script and stylesheets it names, 200, of their
      # type, immutable and byte for byte; the film's first two bytes as a 206
      # with the exact Content-Range; and neither a landing file on the service
      # nor the manifest on the site.
      - name: Check the site serves the landing page as built
        if: steps.gate.outputs.enabled == 'true'
        run: bun run packages/server/scripts/check-landing.ts https://onlay.dev https://app.onlay.dev
      # A deploy can report the right commit and still be unable to sign anyone
      # in: the secrets live on the Worker, not in this repository.
      - name: Check the Worker has its sign-in secrets
        if: steps.gate.outputs.enabled == 'true'
        working-directory: packages/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          names=$(bunx wrangler secret list --format json | jq -r '.[].name')
          missing=0
          for required in WORKOS_API_KEY SESSION_SECRET SUPER_ADMINS; do
            if ! printf '%s\n' "$names" | grep -qx "$required"; then
              echo "::error::the Worker has no $required secret (see packages/server/README.md)"
              missing=1
            fi
          done
          exit "$missing"
      # Exact answers: the status and the whole Location, never a prefix.
      - name: Check sign-in starts on the service
        if: steps.gate.outputs.enabled == 'true'
        run: |
          got=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code} %{redirect_url}' https://app.onlay.dev/auth/login) || { echo "::error::https://app.onlay.dev/auth/login did not answer"; exit 1; }
          # The state differs on every start: the URL without its query must be
          # WorkOS's authorize endpoint, and its query must hold exactly one
          # redirect_uri, the service's callback. (The script is JavaScript: its
          # ${...} are template literals, single-quoted for the shell on purpose.)
          # shellcheck disable=SC2016
          LOGIN_ANSWER="$got" bun -e '
            const got = process.env.LOGIN_ANSWER ?? "";
            const at = got.indexOf(" ");
            const status = got.slice(0, at);
            let url;
            try { url = new URL(got.slice(at + 1)); } catch { url = null; }
            const ok =
              status === "302" &&
              url !== null &&
              url.origin + url.pathname === "https://api.workos.com/user_management/authorize" &&
              url.hash === "" &&
              JSON.stringify(url.searchParams.getAll("redirect_uri")) ===
                JSON.stringify(["https://app.onlay.dev/auth/callback"]);
            if (!ok) {
              // Only the fields checked: never the whole redirect, whose state
              // is a live sign-in attempt.
              const place =
                url !== null &&
                url.origin + url.pathname === "https://api.workos.com/user_management/authorize";
              const callbacks = url === null ? [] : url.searchParams.getAll("redirect_uri");
              const callback =
                callbacks.length === 1 && callbacks[0] === "https://app.onlay.dev/auth/callback";
              console.log(
                `::error::https://app.onlay.dev/auth/login answered ${status};` +
                  ` WorkOS authorize host and path matched: ${place};` +
                  ` ${callbacks.length} redirect_uri, the service callback: ${callback}` +
                  (url !== null && url.hash !== "" ? "; it has a fragment" : ""),
              );
              process.exit(1);
            }
            console.log("sign-in redirects to WorkOS with exactly the service callback");
          '
      # Both origins exactly as designed: swapped or equal settings pass the
      # Worker's own validation, so the answers below are what catch them.
      # The protected-resource document names <PUBLIC_ORIGIN>/mcp; the service's
      # /install redirects to <SITE_ORIGIN>/install only with two origins; the
      # site's /auth/login redirects to <PUBLIC_ORIGIN>/auth/login only on the
      # site host.
      - name: Check the deployed origins are exactly app.onlay.dev and onlay.dev
        if: steps.gate.outputs.enabled == 'true'
        run: |
          failed=0
          # A redirect probe compares the status and the whole Location exactly,
          # and on failure says only the status and whether the host and path
          # were the ones expected, never the Location itself.
          redirect() {
            want_status="$1"; want_location="$2"; shift 2
            out=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$@" || true)
            status="${out%% *}"; location="${out#* }"
            if [ "$status" = "$want_status" ] && [ "$location" = "$want_location" ]; then return 0; fi
            place=no
            if [ -n "$want_location" ] && [ "${location%%\?*}" = "${want_location%%\?*}" ]; then place=yes; fi
            echo "::error::$* answered $status (wanted $want_status); host and path as expected: $place"
            return 1
          }
          resource=$(curl --silent --show-error --fail --max-time 15 https://app.onlay.dev/.well-known/oauth-protected-resource | jq -r '.resource' || true)
          if [ "$resource" = "https://app.onlay.dev/mcp" ]; then echo "the service is https://app.onlay.dev"; else echo "::error::the protected resource is '$resource', not https://app.onlay.dev/mcp"; failed=1; fi
          if redirect 302 https://onlay.dev/install https://app.onlay.dev/install; then echo "the site is https://onlay.dev"; else failed=1; fi
          if redirect 302 https://app.onlay.dev/auth/login https://onlay.dev/auth/login; then echo "onlay.dev is the site host"; else failed=1; fi
          exit "$failed"
      # The site never authenticates anyone: a browser going to sign-in or the
      # web app there is sent on to the service, and a credentialed route is
      # not found.
      - name: Check the site sends sign-in on and refuses the service's routes
        if: steps.gate.outputs.enabled == 'true'
        run: |
          failed=0
          # The status and the whole Location, compared exactly; a failure says
          # only the status and whether the host and path were the ones expected.
          expect() {
            want="$1"; shift
            want_status="${want%% *}"; want_location="${want#* }"
            got=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$@" || true)
            status="${got%% *}"; location="${got#* }"
            if [ "$got" = "$want" ]; then echo "$*: $status"; return; fi
            place=no
            if [ -n "$want_location" ] && [ "${location%%\?*}" = "${want_location%%\?*}" ]; then place=yes; fi
            echo "::error::$* answered $status (wanted $want_status); host and path as expected: $place"
            failed=1
          }
          expect "302 https://app.onlay.dev/app/" https://onlay.dev/app/
          expect "302 https://app.onlay.dev/app/" https://app.onlay.dev/
          expect "404 " https://onlay.dev/api/me
          expect "404 " -X POST https://onlay.dev/mcp
          expect "404 " https://onlay.dev/.well-known/oauth-protected-resource
          expect "404 " https://onlay.dev/app/sw.js
          # The old web app's storage is cleared from the site's /app paths, and
          # only there: never from the home page, never from the service.
          # Each probe must answer with its expected status first: a failed
          # request never counts as "no header".
          probe() {
            out=$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header - --write-out 'status:%{http_code}\n' "$1") || { echo "no answer"; return; }
            status=$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/^status://p')
            header=$(printf '%s\n' "$out" | tr -d '\r' | grep -i '^clear-site-data:' | cut -d' ' -f2- || true)
            echo "$status $header"
          }
          clears() {
            want="$1"; url="$2"; got=$(probe "$url")
            if [ "$got" = "$want" ]; then echo "$url: $got"; else echo "::error::$url answered '$got', not '$want'"; failed=1; fi
          }
          clears '200 ' https://onlay.dev/
          clears '302 "storage"' https://onlay.dev/app/
          clears '404 "storage"' https://onlay.dev/app/sw.js
          clears '302 ' https://app.onlay.dev/
          clears '200 ' https://app.onlay.dev/app/
          clears '200 ' https://app.onlay.dev/app/sw.js
          clears '200 ' https://onlay.dev/install
          exit "$failed"
