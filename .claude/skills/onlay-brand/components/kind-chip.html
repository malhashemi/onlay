<!-- @component name="Kind chip" group="core" desc="Labeled semantic chips for Comment, Ask, and Edit." origin="seed" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onlay Kind chip component</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: var(--space-6); font-family: var(--font-body); background: var(--background); color: var(--foreground); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  </style>
</head>
<body>
  <div class="row">
    <span class="onlay-kind-chip" data-kind="comment">Comment</span>
    <span class="onlay-kind-chip" data-kind="ask">Ask</span>
    <span class="onlay-kind-chip" data-kind="edit">Edit</span>
  </div>
</body>
</html>
